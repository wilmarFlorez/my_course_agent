[project]
name = "my-course-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.2.16",
    "langchain-anthropic>=1.4.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-cli>=0.4.24",
]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "ipykernel>=7.2.0",
    "langgraph-cli[inmem]>=0.4.24",
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
